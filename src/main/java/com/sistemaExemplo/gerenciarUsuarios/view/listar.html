<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Gerenciar Usuários</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        .mvc-badge { font-size: 0.7rem; letter-spacing: 1px; }
    </style>
</head>
<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow-sm">
        <div class="card-header d-flex justify-content-between align-items-center bg-primary text-white">
            <div>
                <strong>Usuários Cadastrados</strong>
            </div>
            <a href="/novo" class="btn btn-light btn-sm">+ Novo Usuário</a>
        </div>

        <div class="card-body p-0">
            <table class="table table-hover mb-0">
                <thead class="table-dark">
                    <tr>
                        <th>#</th>
                        <th>Nome</th>
                        <th>Senha</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="usuario : ${usuarios}">
                        <td th:text="${usuario.id}"></td>
                        <td th:text="${usuario.nome}"></td>
                        <td th:text="${usuario.senha}"></td>
                        <td>
                            <a th:href="@{/{id}/editar(id=${usuario.id})}"
                               class="btn btn-warning btn-sm">Editar</a>

                            <form th:action="@{/{id}/excluir(id=${usuario.id})}"
                                  method="post" style="display:inline"
                                  onsubmit="return confirm('Excluir este usuário?')">
                                <button type="submit" class="btn btn-danger btn-sm">Excluir</button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(usuarios)}">
                        <td colspan="4" class="text-center text-muted py-3">
                            Nenhum usuário cadastrado.
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>

</body>
</html>
