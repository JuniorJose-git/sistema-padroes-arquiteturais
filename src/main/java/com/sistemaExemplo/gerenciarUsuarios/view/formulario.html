<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Formulário de Usuário</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        .mvc-badge { font-size: 0.7rem; letter-spacing: 1px; }
    </style>
</head>
<body class="bg-light">

<div class="container mt-5" style="max-width: 480px;">

    <div class="card shadow-sm">
        <div class="card-header bg-primary text-white">
            <strong th:text="${acao} + ' Usuário'">Usuário</strong>
        </div>

        <div class="card-body">
            <form th:action="${usuario.id != null}
                        ? @{/{id}/editar(id=${usuario.id})}
                        : @{/novo}"
                  th:object="${usuario}"
                  method="post">

                <div class="mb-3">
                    <label for="nome" class="form-label">Nome</label>
                    <input type="text" id="nome" th:field="*{nome}"
                           class="form-control" placeholder="Digite o nome" required>
                </div>

                <div class="mb-3">
                    <label for="senha" class="form-label">Senha</label>
                    <input type="password" id="senha" th:field="*{senha}"
                           class="form-control" placeholder="Digite a senha" required>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary"
                            th:text="${acao}">Salvar</button>
                    <a href="/" class="btn btn-secondary">Cancelar</a>
                </div>

            </form>
        </div>
    </div>
</div>
</body>
</html>
